<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Course Excel Converter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #f0f4fa; padding: 2rem 1rem; }
    .container { max-width: 1400px; margin: 0 auto; }
    .card { background: white; border-radius: 28px; padding: 2rem; box-shadow: 0 20px 40px -12px rgba(0,20,50,0.2); margin-bottom: 2rem; }
    h1 { font-size: 2rem; font-weight: 700; color: #0b2b4a; margin-bottom: 0.25rem; }
    .sub { color: #3e5f7a; font-size: 1rem; border-left: 3px solid #2a7de1; padding-left: 16px; margin-bottom: 1.5rem; }
    .upload-area { background: #f0f6ff; border: 2px dashed #b6cce6; border-radius: 20px; padding: 2rem; text-align: center; cursor: pointer; transition: 0.2s; }
    .upload-area:hover { background: #e7f0fe; border-color: #2a7de1; }
    .upload-area input[type="file"] { display: none; }
    .upload-label { font-size: 1.1rem; font-weight: 500; color: #1a4a76; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .upload-label span { background: #2a7de1; color: white; padding: 10px 32px; border-radius: 60px; font-weight: 500; font-size: 1rem; transition: 0.15s; box-shadow: 0 4px 8px rgba(42,125,225,0.2); }
    .upload-label span:hover { background: #1a5fbb; transform: scale(1.02); }
    .file-name { margin-top: 10px; color: #0b2b4a; font-weight: 500; }
    .action-bar { display: flex; flex-wrap: wrap; gap: 16px; margin: 20px 0 16px; align-items: center; justify-content: space-between; }
    .btn { padding: 10px 24px; border-radius: 60px; font-weight: 500; border: none; cursor: pointer; transition: 0.15s; display: inline-flex; align-items: center; gap: 8px; font-size: 0.95rem; }
    .btn-primary { background: #1f5f9e; color: white; box-shadow: 0 4px 12px rgba(31,95,158,0.3); }
    .btn-primary:hover { background: #134a7a; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; pointer-events: none; }
    .btn-success { background: #1e7e34; color: white; box-shadow: 0 4px 12px rgba(30,126,52,0.3); }
    .btn-success:hover { background: #15652a; transform: translateY(-1px); }
    .btn-success:disabled { opacity: 0.5; pointer-events: none; }
    .stats { background: #eef4fa; padding: 6px 18px; border-radius: 60px; font-weight: 500; font-size: 0.9rem; }
    .section-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 12px; }
    .section-tab { padding: 6px 18px; border-radius: 40px; background: #e9eff7; border: 2px solid transparent; cursor: pointer; font-weight: 500; font-size: 0.85rem; transition: 0.15s; color: #1a4a76; }
    .section-tab:hover { background: #d4e2f7; }
    .section-tab.active { background: #1f5f9e; color: white; border-color: #1f5f9e; }
    .section-tab .badge { background: rgba(255,255,255,0.2); padding: 0 8px; border-radius: 20px; font-size: 0.7rem; margin-left: 4px; }
    .section-tab.active .badge { background: rgba(255,255,255,0.25); }
    .section-tab .order-num { background: rgba(0,0,0,0.08); padding: 0 6px; border-radius: 10px; font-size: 0.65rem; margin-right: 4px; }
    .section-tab.active .order-num { background: rgba(255,255,255,0.2); }
    .section-header { background: #f4f8ff; padding: 12px 16px; border-radius: 12px; margin: 12px 0 8px; display: flex; flex-wrap: wrap; gap: 12px 28px; border: 1px solid #e2ebf6; font-size: 0.85rem; }
    .section-header .item { display: flex; align-items: center; gap: 6px; }
    .section-header .item strong { color: #1a4a76; min-width: 70px; }
    .section-header .item span { font-weight: 600; color: #0b2b4a; }
    .table-wrapper { overflow-x: auto; border-radius: 16px; border: 1px solid #e2ebf6; background: white; margin-top: 8px; max-height: 600px; overflow-y: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 0.8rem; min-width: 900px; }
    th { background: #e9f0fa; color: #153b5e; font-weight: 600; padding: 10px 8px; border-bottom: 2px solid #cbdae9; text-align: center; white-space: nowrap; position: sticky; top: 0; z-index: 10; }
    td { padding: 8px 8px; border-bottom: 1px solid #e1eaf3; text-align: left; vertical-align: middle; }
    tr:hover td { background: #f8fbff; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: #6d8eb0; }
    .empty-state .icon { font-size: 2.8rem; margin-bottom: 12px; }
    .footer-info { margin-top: 1.5rem; font-size: 0.85rem; color: #3b5d7a; border-top: 1px solid #dce6f2; padding-top: 1.2rem; display: flex; flex-wrap: wrap; justify-content: space-between; }
    .highlight { background: #fcf3d0; padding: 0 8px; border-radius: 12px; font-weight: 500; }
    @media (max-width: 640px) { .card { padding: 1.25rem; } h1 { font-size: 1.5rem; } .section-header { flex-direction: column; gap: 6px; } }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>📊 Multi-Course Excel Converter</h1>
    <div class="sub">ফাইলের ক্রম অনুযায়ী সেকশন প্রসেস করুন (যেমন: A → K → B → C)</div>

    <div class="upload-area" id="uploadArea">
      <label for="fileInput" class="upload-label">
        <span>📤 ফাইল আপলোড করুন</span>
        <span style="font-weight:400; font-size:0.85rem; background:transparent; color:#2a5d8a; box-shadow:none; padding:0;">.xlsx / .xls</span>
      </label>
      <input type="file" id="fileInput" accept=".xlsx,.xls">
      <div id="fileNameDisplay" class="file-name">কোনো ফাইল নির্বাচন করা হয়নি</div>
    </div>

    <div class="action-bar">
      <div>
        <button class="btn btn-primary" id="convertBtn" disabled>🔄 কনভার্ট করুন</button>
        <button class="btn btn-success" id="downloadBtn" disabled>⬇ ডাউনলোড (সব সেকশন)</button>
      </div>
      <span id="rowCountDisplay" class="stats">📋 ০টি রেকর্ড</span>
    </div>

    <div id="sectionTabsContainer" style="display:none;">
      <div class="section-tabs" id="sectionTabs"></div>
    </div>

    <div id="sectionHeader" style="display:none;" class="section-header"></div>

    <div class="table-wrapper" id="tableWrapper">
      <div class="empty-state" id="emptyState">
        <div class="icon">📂</div>
        <p><strong>ফাইল আপলোড করুন</strong><br>তারপর "কনভার্ট করুন" বাটনে ক্লিক করুন</p>
      </div>
      <div id="tableContainer" style="display:none;"></div>
    </div>

    <div class="footer-info">
      <span>⚡ মোট <span id="totalSectionsDisplay" class="highlight">০</span>টি সেকশন</span>
      <span id="metaInfo">ফাইল আপলোড করুন</span>
    </div>
  </div>
</div>

<script>
  (function() {
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const convertBtn = document.getElementById('convertBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const rowCountDisplay = document.getElementById('rowCountDisplay');
    const tableContainer = document.getElementById('tableContainer');
    const emptyState = document.getElementById('emptyState');
    const sectionTabsContainer = document.getElementById('sectionTabsContainer');
    const sectionTabs = document.getElementById('sectionTabs');
    const sectionHeader = document.getElementById('sectionHeader');
    const totalSectionsDisplay = document.getElementById('totalSectionsDisplay');
    const metaInfo = document.getElementById('metaInfo');

    let allSections = [];
    let currentSectionIndex = 0;
    let currentFileName = '';
    let isConverted = false;

    // Main parser - reads the file row by row
    function parseMultiSection(workbook) {
      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      if (!sheet) return [];

      const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      if (raw.length < 10) return [];

      const sections = [];
      let i = 0;

      while (i < raw.length) {
        let facultyRowIndex = -1;
        
        for (let j = i; j < Math.min(i + 15, raw.length); j++) {
          const row = raw[j];
          if (!row) continue;
          
          for (let col = 0; col < row.length; col++) {
            const cell = row[col] ? row[col].toString().trim() : '';
            if (cell.toLowerCase() === 'faculty id' || cell.toLowerCase().includes('faculty id')) {
              facultyRowIndex = j;
              break;
            }
          }
          if (facultyRowIndex !== -1) break;
        }

        if (facultyRowIndex === -1) break;

        let metadata = {
          facultyId: '',
          facultyName: '',
          program: '',
          batch: '',
          courseCode: '',
          courseTitle: '',
          credits: '',
          section: ''
        };

        let headerRowIndex = -1;

        for (let j = facultyRowIndex; j < Math.min(facultyRowIndex + 25, raw.length); j++) {
          const row = raw[j];
          if (!row) continue;
          
          const firstCol = row[0] ? row[0].toString().trim().toUpperCase() : '';
          if (firstCol === 'SL') {
            headerRowIndex = j;
            break;
          }
          
          for (let col = 0; col < row.length - 1; col++) {
            const cell = row[col] ? row[col].toString().trim() : '';
            if (!cell) continue;
            
            const lower = cell.toLowerCase();
            const nextVal = row[col + 1] ? row[col + 1].toString().trim() : '';
            
            if (lower === 'faculty id' || lower.includes('faculty id')) {
              metadata.facultyId = nextVal;
            }
            else if (lower === 'faculty name' || lower.includes('faculty name')) {
              metadata.facultyName = nextVal;
            }
            else if (lower === 'program' || lower.includes('program')) {
              metadata.program = nextVal;
            }
            else if (lower === 'batch number' || lower.includes('batch number') || lower.includes('batch no')) {
              metadata.batch = nextVal;
            }
            else if (lower === 'course code' || lower.includes('course code')) {
              metadata.courseCode = nextVal;
            }
            else if (lower === 'course title' || lower.includes('course title')) {
              metadata.courseTitle = nextVal;
            }
            else if (lower === 'credits' || lower.includes('credits')) {
              metadata.credits = nextVal;
            }
            else if (lower === 'section') {
              metadata.section = nextVal;
            }
          }
        }

        if (headerRowIndex === -1) {
          i = facultyRowIndex + 1;
          continue;
        }

        const students = [];
        for (let j = headerRowIndex + 1; j < raw.length; j++) {
          const row = raw[j];
          if (!row || row.length < 2) continue;
          
          const sl = row[0] ? row[0].toString().trim() : '';
          if (sl === '' || isNaN(parseInt(sl, 10))) {
            if (row[0] && row[0].toString().trim().toUpperCase().includes('UTTARA')) {
              break;
            }
            continue;
          }

          const studentId = row[1] ? row[1].toString().trim() : '';
          const studentName = row[2] ? row[2].toString().trim() : '';
          const mBatch = row[3] ? row[3].toString().trim() : '';

          if (studentId === '') continue;
          students.push({
            sl: parseInt(sl, 10),
            studentId,
            studentName,
            mBatch
          });
        }

        if (students.length > 0) {
          if (!metadata.facultyId) metadata.facultyId = '260131';
          if (!metadata.facultyName) metadata.facultyName = 'Rahima Akter';
          if (!metadata.program) metadata.program = 'BSc in Electrical & Electronic Engineering (For Diploma Holder)';
          if (!metadata.batch) metadata.batch = '50';
          if (!metadata.courseCode) metadata.courseCode = 'MAT1101';
          if (!metadata.courseTitle) metadata.courseTitle = 'DIFFERENTIAL AND INTEGRAL CALCULUS';
          if (!metadata.credits) metadata.credits = '3';
          if (!metadata.section) metadata.section = 'A';
          
          sections.push({
            section: metadata.section,
            courseCode: metadata.courseCode,
            metadata: metadata,
            students: students,
            destRows: transformToDestination(metadata, students)
          });
        }

        i = headerRowIndex + students.length + 1;
        if (i >= raw.length) break;
      }

      // 🔥 NO SORTING - Keep original file order
      return sections;
    }

    function transformToDestination(metadata, students) {
      const { facultyId, facultyName, program, batch, courseCode, courseTitle, credits, section } = metadata;
      
      return students.map((s, idx) => {
        let displayStudentId = s.studentId;
        
        if (s.mBatch && s.mBatch.trim() !== '' && s.mBatch.trim() !== batch) {
          displayStudentId = `${s.studentId}(${s.mBatch.trim()})`;
        }
        
        return {
          'SL': idx + 1,
          'Student ID': displayStudentId,
          'Student Name': s.studentName,
          'Batch': batch || '50',
          'Section': section || 'A',
          'Course Code': courseCode || 'MAT1101',
          'Course Title': courseTitle || 'DIFFERENTIAL AND INTEGRAL CALCULUS',
          'Faculty ID': facultyId || '260131',
          'Faculty Name': facultyName || 'Rahima Akter',
          'Program': program || 'BSc in Electrical & Electronic Engineering (For Diploma Holder)',
          'Credits': credits || '3'
        };
      });
    }

    function renderTabs(sections) {
      if (!sections || sections.length === 0) {
        sectionTabsContainer.style.display = 'none';
        return;
      }

      sectionTabsContainer.style.display = 'block';
      sectionTabs.innerHTML = '';
      
      sections.forEach((sec, idx) => {
        const tab = document.createElement('div');
        tab.className = `section-tab${idx === currentSectionIndex ? ' active' : ''}`;
        const count = sec.students.length;
        // Show order number and section
        tab.innerHTML = `<span class="order-num">#${idx + 1}</span> ${sec.courseCode} - সেকশন ${sec.section} <span class="badge">${count}</span>`;
        tab.dataset.index = idx;
        tab.addEventListener('click', () => {
          currentSectionIndex = idx;
          renderTabs(sections);
          renderSection(sections[idx], idx);
        });
        sectionTabs.appendChild(tab);
      });

      totalSectionsDisplay.textContent = sections.length;
    }

    function renderSection(section, index) {
      if (!section || !section.destRows || section.destRows.length === 0) {
        tableContainer.style.display = 'none';
        emptyState.style.display = 'block';
        rowCountDisplay.textContent = '📋 ০টি রেকর্ড';
        sectionHeader.style.display = 'none';
        return;
      }

      emptyState.style.display = 'none';
      tableContainer.style.display = 'block';

      const m = section.metadata;
      sectionHeader.style.display = 'flex';
      sectionHeader.innerHTML = `
        <div class="item"><strong>ক্রম #:</strong> <span style="color:#1f5f9e;font-weight:700;">${index + 1}</span></div>
        <div class="item"><strong>কোর্স:</strong> <span style="color:#1f5f9e;font-size:1.1rem;font-weight:700;">${m.courseCode || 'MAT1101'}</span></div>
        <div class="item"><strong>সেকশন:</strong> <span style="color:#1f5f9e;font-size:1.1rem;font-weight:700;">${m.section || 'A'}</span></div>
        <div class="item"><strong>কোর্স টাইটেল:</strong> <span style="font-weight:600;">${m.courseTitle || 'DIFFERENTIAL AND INTEGRAL CALCULUS'}</span></div>
        <div class="item"><strong>শিক্ষক:</strong> <span style="font-weight:600;">${m.facultyName || 'Rahima Akter'}</span></div>
        <div class="item"><strong>ব্যাচ:</strong> <span>${m.batch || '50'}</span></div>
        <div class="item"><strong>ছাত্র:</strong> <span>${section.destRows.length} জন</span></div>
        <div class="item"><strong style="color:#dc3545;">⚠️ Mismatch:</strong> <span style="color:#dc3545;">${section.destRows.filter(r => r['Student ID'].includes('(')).length} জন</span></div>
      `;

      const rows = section.destRows;
      const headers = Object.keys(rows[0]);
      let html = '<table><thead><tr>';
      headers.forEach(h => {
        html += `<th>${h}</th>`;
      });
      html += '</tr></thead><tbody>';
      rows.forEach(row => {
        html += '<tr>';
        headers.forEach(h => {
          let val = row[h] || '';
          if (h === 'Student ID' && val.includes('(')) {
            val = `<span style="background:#fff3cd;padding:2px 6px;border-radius:4px;font-weight:600;">${val}</span>`;
          }
          html += `<td>${val}</td>`;
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      tableContainer.innerHTML = html;
      rowCountDisplay.textContent = `📋 ${rows.length}টি রেকর্ড (ক্রম #${index + 1}: ${section.courseCode} - সেকশন ${section.section})`;
      metaInfo.textContent = `#${index + 1} · ${section.courseCode} · সেকশন ${section.section} · ${section.metadata.facultyName}`;
    }

    // File handler
    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) {
        fileNameDisplay.textContent = 'কোনো ফাইল নির্বাচন করা হয়নি';
        convertBtn.disabled = true;
        downloadBtn.disabled = true;
        allSections = [];
        isConverted = false;
        resetUI();
        return;
      }

      currentFileName = file.name;
      fileNameDisplay.textContent = `📎 ${file.name} (${(file.size/1024).toFixed(1)} KB)`;

      const reader = new FileReader();
      reader.onload = function(loadEvent) {
        try {
          const data = new Uint8Array(loadEvent.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sections = parseMultiSection(workbook);
          
          if (!sections || sections.length === 0) {
            alert('কোনো সেকশন পাওয়া যায়নি।');
            allSections = [];
            isConverted = false;
            resetUI();
            convertBtn.disabled = true;
            downloadBtn.disabled = true;
            return;
          }

          allSections = sections;
          isConverted = true;
          currentSectionIndex = 0;
          
          renderTabs(sections);
          renderSection(sections[0], 0);
          convertBtn.disabled = false;
          downloadBtn.disabled = false;

          console.log('📋 সেকশনের ক্রম (ফাইল অনুযায়ী):');
          sections.forEach((s, idx) => {
            console.log(`  #${idx + 1}. ${s.courseCode} - সেকশন ${s.section} (${s.students.length} জন)`);
          });

        } catch (err) {
          alert('ফাইল পড়তে সমস্যা: ' + err.message);
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    convertBtn.addEventListener('click', function() {
      if (!allSections || allSections.length === 0) {
        alert('প্রথমে ফাইল আপলোড করুন।');
        return;
      }
      allSections = allSections.map(sec => ({
        ...sec,
        destRows: transformToDestination(sec.metadata, sec.students)
      }));
      isConverted = true;
      renderTabs(allSections);
      renderSection(allSections[currentSectionIndex], currentSectionIndex);
      downloadBtn.disabled = false;
    });

    downloadBtn.addEventListener('click', function() {
      if (!allSections || allSections.length === 0 || !isConverted) {
        alert('কনভার্ট করা ডেটা নেই।');
        return;
      }

      let allRows = [];
      allSections.forEach((sec, idx) => {
        if (sec.destRows && sec.destRows.length > 0) {
          if (idx > 0) {
            allRows.push({
              'SL': '---',
              'Student ID': `=== #${idx + 1} ${sec.courseCode} - সেকশন ${sec.section} ===`,
              'Student Name': sec.metadata.courseTitle || '',
              'Batch': sec.metadata.batch || '',
              'Section': sec.metadata.section || '',
              'Course Code': sec.metadata.courseCode || '',
              'Course Title': '',
              'Faculty ID': sec.metadata.facultyId || '',
              'Faculty Name': sec.metadata.facultyName || '',
              'Program': sec.metadata.program || '',
              'Credits': sec.metadata.credits || ''
            });
          }
          allRows = allRows.concat(sec.destRows);
        }
      });

      if (allRows.length === 0) {
        alert('কোনো ডেটা নেই।');
        return;
      }

      const ws = XLSX.utils.json_to_sheet(allRows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'All Sections');

      const baseName = currentFileName ? currentFileName.replace(/\.[^.]+$/, '') : 'Exam_Attendance';
      const fileName = `${baseName}_Destination.xlsx`;
      XLSX.writeFile(wb, fileName);
    });

    function resetUI() {
      tableContainer.style.display = 'none';
      emptyState.style.display = 'block';
      sectionTabsContainer.style.display = 'none';
      sectionHeader.style.display = 'none';
      rowCountDisplay.textContent = '📋 ০টি রেকর্ড';
      metaInfo.textContent = 'ফাইল আপলোড করুন';
      totalSectionsDisplay.textContent = '০';
    }

    const uploadArea = document.getElementById('uploadArea');
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = '#2a7de1';
      uploadArea.style.background = '#e3edfc';
    });
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.style.borderColor = '#b6cce6';
      uploadArea.style.background = '#f0f6ff';
    });
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = '#b6cce6';
      uploadArea.style.background = '#f0f6ff';
      if (e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        fileInput.dispatchEvent(new Event('change'));
      }
    });
    uploadArea.addEventListener('click', () => fileInput.click());

    resetUI();
  })();
</script>
</body>
</html>
